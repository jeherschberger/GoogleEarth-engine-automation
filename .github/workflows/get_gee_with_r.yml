name: GEE Data Workflow

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:  # Manual trigger

jobs:
  fetch-gee-data:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
        
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          
      - name: Install R packages
        run: |
          install.packages(c("rgee", "reticulate","tidyverse"))
        shell: Rscript {0}
         
      - name: Install rgee dependancies
        run: |
          Rscript -e "
            library(rgee)
            ee_install(py_env = 'rgee', confirm = FALSE)
            "
          
      - name: Run GEE script
        env:
          GEE_PRIVATE_KEY: ${{ secrets.EARTH_ENGINE_KEY }}
        run: |
             echo "$GEE_PRIVATE_KEY" > private-key.json
             Rscript get_data.R

      - name: Commit and push updated CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add data/data_survey_rawgradient.csv
          
          # Only commit and push if the R script actually changed the data
          if ! git diff --staged --quiet; then
            git commit -m "Automated CSV update via R script"
            git push
          else
            echo "No changes detected in CSV. Skipping push."
          fi
